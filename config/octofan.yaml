fans:
  mode: manual
  target_temp_c: 38.0
  hysteresis_c: 2.0
  min_percent: 10
  max_percent: 100
  manual_percent: 10
  max_step_percent: 8
  ai_load_assist: false
  ai_load_boost_percent: 10
  fail_safe_percent: 100
  fail_safe_ramp: true
  poll_interval_seconds: 5.0
  gpu_idle_stop_enabled: false
  gpu_idle_stop_percent: 10
  gpu_idle_stop_delay_seconds: 300.0
  gpu_idle_utilization_percent: 5.0
  gpu_idle_power_watts: 25.0
  gpu_idle_max_gpu_temp_c: 45.0
  gpu_idle_max_intake_temp_c: 35.0
watchdog:
  enabled: true
  keepalive_when_disabled: true
  short_timeout_seconds: 120
  long_timeout_seconds: 1500
  feed_interval_seconds: 5.0
  unhealthy_failures_before_reset: 3
  checks:
  - type: tcp
    target: host.docker.internal:22
    timeout_seconds: 1.0
display:
  enabled: true
  profile: ai
  refresh_interval_seconds: 15.0
  title: null
  persist_to_eeprom: true
leds:
  enabled: true
  poll_interval_seconds: 1.0
  warning_led_id: 0
  online_led_id: 1
  activity_led_id: 2
  off_mode: 0
  on_mode: 1
  fast_blink_mode: 2
  slow_blink_mode: 3
  gpu_activity_utilization_percent: 15.0
  gpu_activity_power_watts: 40.0
llamacpp:
  enabled: false
  timeout_seconds: 2.0
  servers:
  - name: qwen3coder:30b
    gpu: '0'
    base_url: http://llamacpp-qwen3coder:8080
    expected_model: qwen3coder:30b
  - name: qwen3.6:35b
    gpu: '1'
    base_url: http://llamacpp-qwen36-uncensored:8080
    expected_model: qwen3.6:35b
