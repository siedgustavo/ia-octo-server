global:
  scrape_interval: 5s

scrape_configs:
  - job_name: octofan-controller
    static_configs:
      - targets:
          - octofan-controller:8000

  - job_name: node-exporter
    static_configs:
      - targets:
          - host.docker.internal:9100

  - job_name: vllm
    static_configs:
      - targets:
          - vllm:8000
