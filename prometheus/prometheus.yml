global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: octofan-controller
    static_configs:
      - targets:
          - octofan-controller:8000

  - job_name: node-exporter
    static_configs:
      - targets:
          - host.docker.internal:9100
