services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /etc/hostname:/host/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  ollama:
    build:
      context: ./ollama
    image: ${OLLAMA_IMAGE:-octofan/ollama:0.32.5-vram}
    container_name: octofan-ollama
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-131072}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q4_0}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_SCHED_SPREAD: "${OLLAMA_SCHED_SPREAD:-true}"
    volumes:
      - ${OLLAMA_DATA_DIR:-/opt/ollama}:/root/.ollama
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
      - ./ollama:/model-definitions:ro
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  comfyui:
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:cu126-slim}
    container_name: octofan-comfyui
    profiles: ["imagegen"]
    restart: unless-stopped
    environment:
      CLI_ARGS: ${COMFYUI_CLI_ARGS:---listen 0.0.0.0 --port 8188 --lowvram}
    volumes:
      - ${COMFYUI_CACHE_DIR:-/opt/imagegen/comfyui/cache}:/root/.cache
      - ${COMFYUI_CONFIG_DIR:-/opt/imagegen/comfyui/config}:/root/.config
      - ${COMFYUI_LOCAL_DIR:-/opt/imagegen/comfyui/local}:/root/.local
      - ${COMFYUI_CUSTOM_NODES_DIR:-/opt/imagegen/comfyui/custom_nodes}:/root/ComfyUI/custom_nodes
      - ${COMFYUI_MODELS_DIR:-/opt/imagegen/comfyui/models}:/root/ComfyUI/models
      - ${COMFYUI_INPUT_DIR:-/opt/imagegen/comfyui/input}:/root/ComfyUI/input
      - ${COMFYUI_OUTPUT_DIR:-/opt/imagegen/comfyui/output}:/root/ComfyUI/output
      - ${COMFYUI_USER_DIR:-/opt/imagegen/comfyui/user}:/root/ComfyUI/user
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMFYUI_GPU:-1}"]
              capabilities: [gpu]

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
