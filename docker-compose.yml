services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      OCTOFAN_DISPLAY_IP: "${OCTOFAN_DISPLAY_IP:-}"
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /etc/hostname:/host/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  ollama:
    build:
      context: ./ollama
    image: ${OLLAMA_IMAGE:-octofan/ollama:0.32.13-vram}
    container_name: octofan-ollama
    dns:
      - ${OLLAMA_DNS:-172.16.1.1}
    gpus: all
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-3h}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q4_0}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_SCHED_SPREAD: "${OLLAMA_SCHED_SPREAD:-false}"
    volumes:
      - ${OLLAMA_DATA_DIR:-/opt/ollama}:/root/.ollama
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
      - ${MODELS_ARCHIVE_DIR:-/opt/models-archive}:/models-archive:ro
      - ./ollama:/model-definitions:ro
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  deepseek-v4-ktransformers:
    image: ${KTRANSFORMERS_IMAGE:-approachingai/ktransformers:DSV4-specific}
    container_name: octofan-deepseek-v4-ktransformers
    profiles: ["ktransformers"]
    gpus: all
    ipc: host
    cap_add:
      - SYS_NICE
    restart: unless-stopped
    environment:
      CUDA_VISIBLE_DEVICES: "${KTRANSFORMERS_CUDA_VISIBLE_DEVICES:-0,1,2,3}"
      TP: "${KTRANSFORMERS_TP:-4}"
      MEM_FRACTION: "${KTRANSFORMERS_MEM_FRACTION:-0.90}"
      CHUNKED_PREFILL_SIZE: "${KTRANSFORMERS_CHUNKED_PREFILL_SIZE:-4096}"
      CONTEXT_LENGTH: "${KTRANSFORMERS_CONTEXT_LENGTH:-1048576}"
      MAX_RUNNING_REQUESTS: "${KTRANSFORMERS_MAX_RUNNING_REQUESTS:-1}"
      KT_GPU_PREFILL_TOKEN_THRESHOLD: "${KTRANSFORMERS_GPU_PREFILL_TOKEN_THRESHOLD:-2048}"
      SWA_FULL_TOKENS_RATIO: "${KTRANSFORMERS_SWA_FULL_TOKENS_RATIO:-0.4}"
    volumes:
      - ${KTRANSFORMERS_MODEL_DIR:-/opt/models-archive/DeepSeek-V4-Flash-0731}:/model:ro
    ports:
      - "${KTRANSFORMERS_PORT:-30000}:30000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:30000/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
