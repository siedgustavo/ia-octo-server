services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /etc/hostname:/host/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  llamacpp-qwen3coder:
    image: ${QWEN3CODER_IMAGE:-ghcr.io/siedgustavo/llama-cpp-rpc:b8857-cuda}
    container_name: octofan-llamacpp-qwen3coder
    restart: unless-stopped
    entrypoint: ["/bin/bash"]
    command:
      - -lc
      - |
        set -euo pipefail
        for lib in /usr/lib/x86_64-linux-gnu/libllama.so /usr/lib/x86_64-linux-gnu/libggml.so; do
          if [ -e "$$lib" ] && [ ! -e "$$lib.0" ]; then ln -s "$$lib" "$$lib.0"; fi
        done
        exec /app/llama-server \
          --host 0.0.0.0 \
          --port 8080 \
          --alias ${QWEN3CODER_ALIAS:-qwen3coder:30b} \
          --model /models/${QWEN3CODER_MODEL:-Huihui-Qwen3-Coder-30B-A3B-Instruct-abliterated.i1-IQ4_XS.gguf} \
          --ctx-size ${QWEN3CODER_CTX_SIZE:-65536} \
          --n-gpu-layers ${QWEN3CODER_N_GPU_LAYERS:-999} \
          --parallel ${QWEN3CODER_PARALLEL:-1} \
          --batch-size ${QWEN3CODER_BATCH_SIZE:-512} \
          --ubatch-size ${QWEN3CODER_UBATCH_SIZE:-128} \
          --cache-ram 0 \
          --ctx-checkpoints 0 \
          --no-cache-prompt \
          --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${QWEN3CODER_PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN3CODER_GPU:-0}"]
              capabilities: [gpu]

  llamacpp-qwen36-uncensored:
    image: ${QWEN36_UNCENSORED_IMAGE:-ghcr.io/siedgustavo/llama-cpp-rpc:b8857-cuda}
    container_name: octofan-llamacpp-qwen36-uncensored
    restart: unless-stopped
    entrypoint: ["/bin/bash"]
    command:
      - -lc
      - |
        set -euo pipefail
        for lib in /usr/lib/x86_64-linux-gnu/libllama.so /usr/lib/x86_64-linux-gnu/libggml.so; do
          if [ -e "$$lib" ] && [ ! -e "$$lib.0" ]; then ln -s "$$lib" "$$lib.0"; fi
        done
        exec /app/llama-server \
          --host 0.0.0.0 \
          --port 8080 \
          --alias ${QWEN36_UNCENSORED_ALIAS:-qwen3.6:35b} \
          --model /models/${QWEN36_UNCENSORED_MODEL:-qwen3.6-uncensored.gguf} \
          --ctx-size ${QWEN36_UNCENSORED_CTX_SIZE:-65536} \
          --n-gpu-layers ${QWEN36_UNCENSORED_N_GPU_LAYERS:-999} \
          --parallel ${QWEN36_UNCENSORED_PARALLEL:-1} \
          --batch-size ${QWEN36_UNCENSORED_BATCH_SIZE:-512} \
          --ubatch-size ${QWEN36_UNCENSORED_UBATCH_SIZE:-128} \
          --cache-ram 0 \
          --ctx-checkpoints 0 \
          --no-cache-prompt \
          --chat-template-kwargs '{"enable_thinking":false}' \
          --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${QWEN36_UNCENSORED_PORT:-8081}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${QWEN36_UNCENSORED_GPU:-1}"]
              capabilities: [gpu]

  llamacpp-llama31-pro:
    image: ${LLAMA31_PRO_IMAGE:-ghcr.io/siedgustavo/llama-cpp-rpc:latest-cuda}
    container_name: octofan-llamacpp-llama31-pro
    restart: unless-stopped
    entrypoint: ["/bin/bash"]
    command:
      - -lc
      - |
        set -euo pipefail
        for lib in /usr/lib/x86_64-linux-gnu/libllama.so /usr/lib/x86_64-linux-gnu/libggml.so; do
          if [ -e "$$lib" ] && [ ! -e "$$lib.0" ]; then ln -s "$$lib" "$$lib.0"; fi
        done
        exec /app/llama-server \
          --host 0.0.0.0 \
          --port 8080 \
          --alias ${LLAMA31_PRO_ALIAS:-llama3.1:8b} \
          --model /models/${LLAMA31_PRO_MODEL:-llama31-pro.gguf} \
          --ctx-size ${LLAMA31_PRO_CTX_SIZE:-8192} \
          --n-gpu-layers ${LLAMA31_PRO_N_GPU_LAYERS:-999} \
          --parallel ${LLAMA31_PRO_PARALLEL:-1} \
          --batch-size ${LLAMA31_PRO_BATCH_SIZE:-512} \
          --ubatch-size ${LLAMA31_PRO_UBATCH_SIZE:-128} \
          --cache-ram 0 \
          --ctx-checkpoints 0 \
          --no-cache-prompt \
          --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${LLAMA31_PRO_PORT:-8082}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMA31_PRO_GPU:-2}"]
              capabilities: [gpu]

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
