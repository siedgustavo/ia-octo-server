services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /etc/hostname:/host/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  llama-server-qwen3coder:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llama-qwen3coder
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - ${QWEN3CODER_GGUF:-/modelos/qwen3coder-35b.gguf}
      - -ngl
      - "${QWEN3CODER_N_GPU_LAYERS:-99}"
      - --ctx-size
      - "${QWEN3CODER_CTX_SIZE:-32768}"
    environment:
      QWEN3CODER_GGUF: ${QWEN3CODER_GGUF:-/modelos/qwen3coder-35b.gguf}
      QWEN3CODER_CTX_SIZE: ${QWEN3CODER_CTX_SIZE:-32768}
      QWEN3CODER_N_GPU_LAYERS: ${QWEN3CODER_N_GPU_LAYERS:-99}
    volumes:
      - ${MODELS_DIR:-/modelos}:/modelos:ro
    ports:
      - "${QWEN3CODER_PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_GPU0_DEVICE:-0}"]
              capabilities: [gpu]

  llama-server-qwen36-uncensored:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llama-qwen36-uncensored
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - ${QWEN36_UNCENSORED_GGUF:-/modelos/qwen3.6-uncensored.gguf}
      - -ngl
      - "${QWEN36_UNCENSORED_N_GPU_LAYERS:-99}"
      - --ctx-size
      - "${QWEN36_UNCENSORED_CTX_SIZE:-32768}"
    environment:
      QWEN36_UNCENSORED_GGUF: ${QWEN36_UNCENSORED_GGUF:-/modelos/qwen3.6-uncensored.gguf}
      QWEN36_UNCENSORED_CTX_SIZE: ${QWEN36_UNCENSORED_CTX_SIZE:-32768}
      QWEN36_UNCENSORED_N_GPU_LAYERS: ${QWEN36_UNCENSORED_N_GPU_LAYERS:-99}
    volumes:
      - ${MODELS_DIR:-/modelos}:/modelos:ro
    ports:
      - "${QWEN36_UNCENSORED_PORT:-8081}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_GPU1_DEVICE:-1}"]
              capabilities: [gpu]

  llama-server-llama31-pro:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llama-llama31-pro
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - ${LLAMA31_PRO_GGUF:-/modelos/llama3.1-pro.gguf}
      - -ngl
      - "${LLAMA31_PRO_N_GPU_LAYERS:-99}"
      - --ctx-size
      - "${LLAMA31_PRO_CTX_SIZE:-32768}"
    environment:
      LLAMA31_PRO_GGUF: ${LLAMA31_PRO_GGUF:-/modelos/llama3.1-pro.gguf}
      LLAMA31_PRO_CTX_SIZE: ${LLAMA31_PRO_CTX_SIZE:-32768}
      LLAMA31_PRO_N_GPU_LAYERS: ${LLAMA31_PRO_N_GPU_LAYERS:-99}
    volumes:
      - ${MODELS_DIR:-/modelos}:/modelos:ro
    ports:
      - "${LLAMA31_PRO_PORT:-8082}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_GPU2_DEVICE:-2}"]
              capabilities: [gpu]

  llama-server-playground:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llama-playground
    restart: unless-stopped
    profiles: ["playground"]
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -m
      - ${PLAYGROUND_GGUF:-/modelos/playground.gguf}
      - -ngl
      - "${PLAYGROUND_N_GPU_LAYERS:-99}"
      - --ctx-size
      - "${PLAYGROUND_CTX_SIZE:-32768}"
    environment:
      PLAYGROUND_GGUF: ${PLAYGROUND_GGUF:-/modelos/playground.gguf}
      PLAYGROUND_CTX_SIZE: ${PLAYGROUND_CTX_SIZE:-32768}
      PLAYGROUND_N_GPU_LAYERS: ${PLAYGROUND_N_GPU_LAYERS:-99}
    volumes:
      - ${MODELS_DIR:-/modelos}:/modelos:ro
    ports:
      - "${PLAYGROUND_PORT:-8083}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_GPU3_DEVICE:-3}"]
              capabilities: [gpu]

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
