services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: octofan-ollama
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

volumes:
  prometheus-data:
  grafana-data:
  ollama-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
