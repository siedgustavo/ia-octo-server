services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /etc/hostname:/host/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  llamacpp-rpc-gpu0:
    image: ${LLAMACPP_RPC_IMAGE:-evilfreelancer/llama.cpp-rpc:latest-cuda}
    container_name: octofan-llamacpp-rpc-gpu0
    restart: unless-stopped
    entrypoint: ["/app/rpc-server"]
    command: ["--host", "0.0.0.0", "--port", "${LLAMACPP_RPC_GPU0_PORT:-5000}", "--device", "CUDA0"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "${LLAMACPP_RPC_GPU0_DEVICE:-0}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${LLAMACPP_RPC_GPU0_PORT:-5000}:${LLAMACPP_RPC_GPU0_PORT:-5000}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_RPC_GPU0_DEVICE:-0}"]
              capabilities: [gpu]

  llamacpp-rpc-gpu1:
    image: ${LLAMACPP_RPC_IMAGE:-evilfreelancer/llama.cpp-rpc:latest-cuda}
    container_name: octofan-llamacpp-rpc-gpu1
    restart: unless-stopped
    entrypoint: ["/app/rpc-server"]
    command: ["--host", "0.0.0.0", "--port", "${LLAMACPP_RPC_GPU1_PORT:-5001}", "--device", "CUDA0"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "${LLAMACPP_RPC_GPU1_DEVICE:-1}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${LLAMACPP_RPC_GPU1_PORT:-5001}:${LLAMACPP_RPC_GPU1_PORT:-5001}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_RPC_GPU1_DEVICE:-1}"]
              capabilities: [gpu]

  llamacpp-rpc-gpu2:
    image: ${LLAMACPP_RPC_IMAGE:-evilfreelancer/llama.cpp-rpc:latest-cuda}
    container_name: octofan-llamacpp-rpc-gpu2
    restart: unless-stopped
    entrypoint: ["/app/rpc-server"]
    command: ["--host", "0.0.0.0", "--port", "${LLAMACPP_RPC_GPU2_PORT:-5002}", "--device", "CUDA0"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "${LLAMACPP_RPC_GPU2_DEVICE:-2}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${LLAMACPP_RPC_GPU2_PORT:-5002}:${LLAMACPP_RPC_GPU2_PORT:-5002}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_RPC_GPU2_DEVICE:-2}"]
              capabilities: [gpu]

  llamacpp-rpc-gpu3:
    image: ${LLAMACPP_RPC_IMAGE:-evilfreelancer/llama.cpp-rpc:latest-cuda}
    container_name: octofan-llamacpp-rpc-gpu3
    restart: unless-stopped
    entrypoint: ["/app/rpc-server"]
    command: ["--host", "0.0.0.0", "--port", "${LLAMACPP_RPC_GPU3_PORT:-5003}", "--device", "CUDA0"]
    environment:
      NVIDIA_VISIBLE_DEVICES: "${LLAMACPP_RPC_GPU3_DEVICE:-3}"
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - "${LLAMACPP_RPC_GPU3_PORT:-5003}:${LLAMACPP_RPC_GPU3_PORT:-5003}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMACPP_RPC_GPU3_DEVICE:-3}"]
              capabilities: [gpu]

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
