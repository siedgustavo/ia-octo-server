services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      OCTOFAN_DISPLAY_IP: "${OCTOFAN_DISPLAY_IP:-172.16.1.6}"
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/hostname:/host/etc/hostname:ro
      - /etc/hosts:/host/etc/hosts:ro
      # Heartbeat del chequeo "disk" del watchdog: debe vivir en el disco raiz
      # del host (NVMe) para detectar que se cayo aunque sshd siga respondiendo.
      - /var/lib/octofan-watchdog:/watchdog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
