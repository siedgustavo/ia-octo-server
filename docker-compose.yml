services:
  octofan-controller:
    build: .
    container_name: octofan-controller
    privileged: true
    gpus: all
    restart: unless-stopped
    environment:
      OCTOFAN_CONFIG: /config/octofan.yaml
      OCTOFAN_BIN: /opt/octofan/fan_controller_cli
      OCTOFAN_DISPLAY_IP: "${OCTOFAN_DISPLAY_IP:-}"
      # Set to "1" to try the stack without Octofan USB hardware.
      OCTOFAN_MOCK: "${OCTOFAN_MOCK:-0}"
    volumes:
      - ./config:/config
      - /dev/bus/usb:/dev/bus/usb
      - /etc/hostname:/host/etc/hostname:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OCTOFAN_CONTROLLER_PORT:-8000}:8000"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: octofan-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - octofan-controller
      - node-exporter

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.8.2
    container_name: octofan-node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave

  grafana:
    image: grafana/grafana:11.4.0
    container_name: octofan-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: octofan
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

  ollama:
    build:
      context: ./ollama
    image: ${OLLAMA_IMAGE:-octofan/ollama:0.32.5-vram}
    container_name: octofan-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
      OLLAMA_KV_CACHE_TYPE: "${OLLAMA_KV_CACHE_TYPE:-q4_0}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      OLLAMA_SCHED_SPREAD: "${OLLAMA_SCHED_SPREAD:-false}"
    volumes:
      - ${OLLAMA_DATA_DIR:-/opt/ollama}:/root/.ollama
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
      - ./ollama:/model-definitions:ro
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OLLAMA_GPU_0:-0}", "${OLLAMA_GPU_1:-1}"]
              capabilities: [gpu]

  llamacpp-llama31-pro:
    image: ${LLAMA31_PRO_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llamacpp-llama31-pro
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - ${LLAMA31_PRO_ALIAS:-llama3.1:8b}
      - --model
      - /models/${LLAMA31_PRO_MODEL:-Llama-3.1-Pro-Coder-v1.Q4_K_M.gguf}
      - --ctx-size
      - ${LLAMA31_PRO_CTX_SIZE:-131072}
      - --n-gpu-layers
      - ${LLAMA31_PRO_N_GPU_LAYERS:-999}
      - --parallel
      - ${LLAMA31_PRO_PARALLEL:-1}
      - --batch-size
      - ${LLAMA31_PRO_BATCH_SIZE:-512}
      - --ubatch-size
      - ${LLAMA31_PRO_UBATCH_SIZE:-128}
      - --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${LLAMA31_PRO_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${LLAMA31_PRO_GPU:-2}"]
              capabilities: [gpu]

  llamacpp-permission-classifier:
    image: ${PERMISSION_CLASSIFIER_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda}
    container_name: octofan-llamacpp-permission-classifier
    restart: unless-stopped
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --alias
      - ${PERMISSION_CLASSIFIER_ALIAS:-qwen2.5-coder:7b}
      - --model
      - /models/${PERMISSION_CLASSIFIER_MODEL:-Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf}
      - --ctx-size
      - ${PERMISSION_CLASSIFIER_CTX_SIZE:-131072}
      - --n-gpu-layers
      - ${PERMISSION_CLASSIFIER_N_GPU_LAYERS:-999}
      - --parallel
      - ${PERMISSION_CLASSIFIER_PARALLEL:-1}
      - --batch-size
      - ${PERMISSION_CLASSIFIER_BATCH_SIZE:-512}
      - --ubatch-size
      - ${PERMISSION_CLASSIFIER_UBATCH_SIZE:-128}
      - --flash-attn
      - "on"
      - --cache-type-k
      - ${PERMISSION_CLASSIFIER_CACHE_TYPE:-q8_0}
      - --cache-type-v
      - ${PERMISSION_CLASSIFIER_CACHE_TYPE:-q8_0}
      - --no-mmap
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp/models}:/models:ro
    ports:
      - "${PERMISSION_CLASSIFIER_PORT:-8083}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PERMISSION_CLASSIFIER_GPU:-3}"]
              capabilities: [gpu]

  comfyui:
    image: ${COMFYUI_IMAGE:-yanwk/comfyui-boot:cu126-slim}
    container_name: octofan-comfyui
    profiles: ["imagegen"]
    restart: unless-stopped
    environment:
      CLI_ARGS: ${COMFYUI_CLI_ARGS:---listen 0.0.0.0 --port 8188 --lowvram}
    volumes:
      - ${COMFYUI_CACHE_DIR:-/opt/imagegen/comfyui/cache}:/root/.cache
      - ${COMFYUI_CONFIG_DIR:-/opt/imagegen/comfyui/config}:/root/.config
      - ${COMFYUI_LOCAL_DIR:-/opt/imagegen/comfyui/local}:/root/.local
      - ${COMFYUI_CUSTOM_NODES_DIR:-/opt/imagegen/comfyui/custom_nodes}:/root/ComfyUI/custom_nodes
      - ${COMFYUI_MODELS_DIR:-/opt/imagegen/comfyui/models}:/root/ComfyUI/models
      - ${COMFYUI_INPUT_DIR:-/opt/imagegen/comfyui/input}:/root/ComfyUI/input
      - ${COMFYUI_OUTPUT_DIR:-/opt/imagegen/comfyui/output}:/root/ComfyUI/output
      - ${COMFYUI_USER_DIR:-/opt/imagegen/comfyui/user}:/root/ComfyUI/user
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${COMFYUI_GPU:-1}"]
              capabilities: [gpu]

volumes:
  prometheus-data:
  grafana-data:

networks:
  default:
    name: ${OCTOFAN_DOCKER_NETWORK:-octofan-ai}
