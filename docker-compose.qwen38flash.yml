# Servicio dedicado para Qwen3.8-Flash-Next sobre llama.cpp upstream.
# El GGUF oficial de Unsloth debe estar bajo QWEN_MODELS_DIR.

services:
  qwen38flash:
    build:
      context: ./llamacpp
      dockerfile: Dockerfile.qwen38flash
    image: ${QWEN_IMAGE:-octofan/llamacpp:qwen38flash-upstream}
    container_name: qwen38flash
    gpus: all
    restart: unless-stopped
    # Le da tiempo al entrypoint de guardar el KV cache (hasta 262144 tokens
    # en Q8_0) a disco antes de que compose mande SIGKILL.
    stop_grace_period: 120s
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Leidas por entrypoint-kv-cache.sh para el save/restore de cada slot.
      SLOT_SAVE_PATH: /kv-cache
      KV_CACHE_FILE: qwen3.8-flash-next
      # Debe coincidir con --parallel de mas abajo.
      SLOT_COUNT: "1"
    volumes:
      - ${QWEN_MODELS_DIR:-/opt/models-archive}:/models:ro
      # Persiste el KV cache del slot 0 entre reinicios del contenedor para
      # no re-prefillear el contexto largo de la sesion de opencode.
      - ${QWEN_KV_CACHE_DIR:-./kv-cache}:/kv-cache
    ports:
      - "${QWEN_PORT:-8091}:8080"
    command:
      - --model
      - /models/${QWEN_MODEL_DIR:-UD-Q4_K_XL}/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf
      - --alias
      - qwen3.8-flash-next
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Layer split evita el cuello de botella del switch PCIe Gen2 x1 compartido
      # por GPU 2 y 3. Ver docs/qwen38flash-split-benchmark.md.
      - --split-mode
      - layer
      - --tensor-split
      # GPU 0 tambien aloja buffers temporales y tensores especiales. Se le
      # asigna una fraccion menor para conservar margen durante prompts largos.
      - "0.9,1,1,1.1"
      - --n-gpu-layers
      - "999"
      # Contexto nativo declarado por Qwen/Unsloth; no reducir por default.
      - --ctx-size
      - "262144"
      # Se probo --parallel 2 para tener 2 conversaciones de OpenCode
      # residentes a la vez, pero el ruteo automatico de llama.cpp elige el
      # slot de MEJOR similitud de prefijo, no "el slot libre para una
      # conversacion nueva": como el system prompt de OpenCode domina el
      # conteo de tokens, dos proyectos distintos siguen cayendo en el mismo
      # slot (uno pisa al otro) igual que con 1 solo slot, y el slot extra
      # termino absorbido por las llamadas internas del sub-agente "title" de
      # OpenCode. No resuelve nada y cuesta la mitad del contexto nativo
      # (131072 en vez de 262144) mas VRAM/buffers duplicados (ya hubo un OOM
      # en GPU0 con mas slots, ver docs/qwen38flash-split-benchmark.md). Un
      # unico slot conserva el contexto nativo completo.
      - --parallel
      - "1"
      - --batch-size
      - "512"
      - --ubatch-size
      - "128"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --flash-attn
      - on
      # Habilita POST /slots/{id}?action=save|restore para persistir el KV
      # cache a disco. Debe coincidir con SLOT_SAVE_PATH (ver entrypoint).
      - --slot-save-path
      - /kv-cache
      # Cache de prompts en RAM del host (octoserver tiene 125GiB, este
      # servicio no ofloadea nada a CPU asi que hay margen de sobra). Deja
      # que OpenCode vuelva a una conversacion anterior sin reprocesarla de
      # cero cuando el cambio de tema perdio mas de la mitad del contenido
      # del slot (f_keep < 0.5): confirmado con instrumentacion de trafico
      # real (ver docs/kv-cache-persistence.md), no es teorico. El pool
      # desaloja por FIFO al llegar al limite; con sesiones cortas de
      # OpenCode (~11k tokens de system prompt+tools) rara vez pasa de
      # unos pocos MiB por entrada, muy lejos del limite de 64GiB.
      # 65536 MiB = 64GiB, deja ~60GiB libres para OS/page-cache/otros.
      - --cache-ram
      - "65536"
      # Espaciado entre checkpoints de contexto: el default (8192) es
      # grueso para diffs chicos tipicos de un flujo agentico (un tool
      # call, un archivo leido). 1024 da mas puntos de recuperacion a
      # cambio de algo de VRAM/RAM extra.
      - --checkpoint-min-step
      - "1024"
      # Techo de checkpoints por slot (viven en VRAM, ~112.5 MiB cada uno,
      # confirmado con --verbosity 4). El default (32) en el peor caso
      # teorico costaria ~3.6GiB, mucho para un margen libre de 1.3-2.5GB
      # por GPU. En un dia entero de pruebas reales (cambios de conversacion
      # frecuentes) nunca se vieron mas de 4 checkpoints vivos a la vez -- la
      # logica interna los invalida solos al cambiar de tema -- pero 8 acota
      # el peor caso teorico (~900MiB) sin costar nada en el uso real.
      - --ctx-checkpoints
      - "8"
      - --chat-template-kwargs
      - '{"reasoning_effort":"medium"}'
      - --jinja
      # Verbosity 4 (trace) para ver el estado real del prompt cache en RAM
      # (cuantas entradas, cuantos MiB) en cada save/load, y si un intento de
      # reuso encontro o no una entrada mejor. Sin esto, --cache-ram es una
      # caja negra: no hay forma de saber si crecio, si desalojo algo o si
      # encontro un match, solo se infiere indirectamente de los tiempos de
      # prefill. Aumenta el volumen de logs; si molesta, bajar a 3 (default).
      - --verbosity
      - "4"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 40
      start_period: 600s

networks:
  default:
    name: ${QWEN_DOCKER_NETWORK:-qwen38flash}
