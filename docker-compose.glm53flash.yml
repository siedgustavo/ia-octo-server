# Compose dedicado para GLM-5.3-Flash (GLM-5-Next) sobre llama.cpp.
# Corre aparte del stack principal (docker-compose.yml).
#
# Uso en octoserver:
#   docker compose -f docker-compose.glm53flash.yml up --build -d
#
# El modelo (GGUF UD-IQ1_S de Unsloth, 3 shards) esta en:
#   /opt/models-archive/GLM-5.3-Flash-UD-IQ1_S/
#
# Config ganadora tras benchmark (2026-08-29): la mejor GENERACION (~15 tok/s).
# Detalle y comparativa en docs/glm53flash-tuning.md.
#  - Imagen glm5next-mtp-27752: build con soporte GLM5Next + kernels DeltaNet/DSA.
#  - Cuantizacion IQ1_S (~93 GB): mas liviana que Q2_K_XL, ~14% mas rapida.
#  - --fit on (auto-fit): reparte capas/expertos por VRAM real y BALANCEA mejor
#    la generacion que un tensor-split manual. NO usar --n-cpu-moe +
#    --tensor-split a mano: --tensor-split reparte por CANTIDAD DE CAPAS, no por
#    memoria, y en un MoE deja GPU0/1 casi vacias (~41 GiB desperdiciados),
#    empujando mas expertos a CPU. Medido el 2026-09-11: n-cpu-moe 28 +
#    split 1,1,1,1 da 30 tok/s prompt y 10 tok/s gen, contra 227/21.5 del
#    auto-fit. Ver docs/glm53flash-benchmark.md.
#  - --flash-attn on: en este build libera ~8-9 GiB/GPU y no rompe MLA.
#  - ctx 131072 (128k): el usuario lo fijo; libera KV vs 262k y mejora gen.
#  - MTP (--spec-type draft-mtp) descartado: acepta 96,9% draft pero baja la gen
#    a 9 tok/s porque el cuello es el MoE en CPU/RAM, no la GPU.
#
# Barrido adicional (2026-10-03): --load-mode none y subir threads (-t/-tb a
# 42 u 56, contra el default de 28) no cambiaron nada (generacion limitada
# por ancho de banda de memoria del host, no por cantidad de threads ni modo
# de carga). --ubatch-size 128->256 si gano bastante prefill sin tocar la
# generacion; ver el comentario junto a --ubatch-size mas abajo.

services:
  glm53flash:
    build:
      context: ./llamacpp
    image: ${LLAMACPP_IMAGE:-octofan/llamacpp:glm5next-mtp-27752-test}
    container_name: glm53flash
    gpus: all
    restart: unless-stopped
    # Le da tiempo al entrypoint de guardar el KV cache a disco antes de que
    # compose mande SIGKILL.
    stop_grace_period: 120s
    environment:
      NVIDIA_TF32_OVERRIDE: "0"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Leidas por entrypoint-kv-cache.sh para el save/restore del slot 0.
      SLOT_SAVE_PATH: /kv-cache
      KV_CACHE_FILE: glm-5.3-flash-iq1-s
    volumes:
      - ${GLM_MODELS_DIR:-/opt/models-archive}:/models:ro
      # Persiste el KV cache del slot 0 entre reinicios del contenedor para
      # no re-prefillear el contexto largo de la sesion de opencode.
      - ${GLM_KV_CACHE_DIR:-./kv-cache-glm}:/kv-cache
    ports:
      - "${GLM_PORT:-8090}:8080"
    command:
      - --model
      - ${GLM_MODEL_PATH:-/models/GLM-5.3-Flash-UD-IQ1_S/GLM-5.3-Flash-UD-IQ1_S-00001-of-00003.gguf}
      - --alias
      - ${GLM_MODEL_ALIAS:-glm-5.3-flash-iq1-s}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      # Layer split: es el modo compatible con la atencion hibrida de GLM-5.
      # El modo tensor es experimental y este PR no soporta split buffers.
      - --split-mode
      - layer
      # Auto-fit: el runtime calcula placement de capas y expertos MoE segun la
      # VRAM real de cada GPU, dejando el margen indicado por --fit-target.
      # Reemplaza al tensor-split/n-cpu-moe manuales y balancea mejor la gen.
      - --fit
      - "on"
      # 512 MiB de margen por GPU en vez de 1024: mide +19.8% prompt y +5.2%
      # generacion (227.2/21.5 contra 189.6/20.5 tok/s). Validado con estres de
      # contexto largo hasta 100k tokens sin OOM, quedando 675-769 MiB libres en
      # las GPU mas cargadas. Si alguna vez aparece un OOM, volver a 1024 con
      # GLM_FIT_TARGET sin tocar este archivo.
      # Ver docs/glm53flash-benchmark.md, "Re-benchmark de GLM, 2026-09-11".
      - --fit-target
      - ${GLM_FIT_TARGET:-512,512,512,512}
      # El modelo declara 1M nativo, pero para esta instancia dedicada el
      # usuario eligio explicitamente el mismo contexto operativo que Qwen.
      # 128k libera KV cache vs 262k y sube la generacion (~13 -> ~15 tok/s).
      - --ctx-size
      - "131072"
      # Una unica sesion dedicada evita reservar contexto para slots sin uso.
      - --parallel
      - "1"
      # El compute buffer del grafo escala con ubatch. Subido de 128 a 256 el
      # 2026-10-03: a 256 el prefill mejora +29% en corto (229->295 tok/s) y
      # +13-29% en contexto largo segun la profundidad, sin tocar generacion
      # (CPU-bound por los expertos MoE ofloadeados, no por el batch). Se
      # probo bajar --fit-target a 256 para sumarle margen al auto-fit, pero
      # la ganancia fue nula (+4% prompt, 0% gen) y el margen quedo en 121
      # MiB, muy riesgoso. Tambien se probo ubatch 384: otro +14% de prompt,
      # pero el margen baja a 291 MiB y GLM tiene reportes upstream de
      # checkpoints de contexto que crecen a varios cientos de MiB o mas de
      # 1 GiB en sesiones largas (este compose no fija --ctx-checkpoints, a
      # diferencia de qwen38flash) asi que no se adopta por el riesgo de OOM
      # combinado. Validado con estres de contexto largo (120019 tokens)
      # sin OOM, quedando 429-549 MiB libres en la GPU mas ajustada.
      # Ver docs/glm53flash-benchmark.md, "Barrido de ubatch y KV, 2026-10-03".
      - --batch-size
      - "512"
      - --ubatch-size
      - "256"
      # KV cache Q8_0: antes este compose no fijaba tipo de KV (F16 por
      # default). A --fit-target 512 no cambia el placement de expertos ni
      # la velocidad (229.99 vs 229.14 tok/s, dentro del ruido), pero libera
      # margen real: 549 MiB libres contra 429 MiB con KV en F16 bajo el
      # mismo estres de 120019 tokens. Es margen de seguridad gratis, no una
      # mejora de velocidad.
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      # Flash Attention ON: en este build no rompe MLA y libera ~8-9 GiB/GPU,
      # margen que el auto-fit usa para colocar mas expertos en GPU.
      - --flash-attn
      - "on"
      # Sampling recomendado por Unsloth para la mayoria de las tareas.
      - --temp
      - "1.0"
      - --top-p
      - "0.95"
      # Unsloth recomienda max por defecto; OpenCode puede sobrescribirlo por
      # request con reasoning_effort=low|high|max.
      - --chat-template-kwargs
      - '{"reasoning_effort":"max"}'
      - --jinja
      - --metrics
      # Habilita POST /slots/{id}?action=save|restore para persistir el KV
      # cache a disco. Debe coincidir con SLOT_SAVE_PATH (ver entrypoint).
      - --slot-save-path
      - /kv-cache
      # Cache de prompts en RAM del host para reusar conversaciones de
      # OpenCode separadas en el tiempo (no simultaneas) sin reprocesarlas
      # de cero: se dispara cuando volver a una conversacion perderia mas
      # de la mitad del contexto actual del slot (f_keep < 0.5). Probado y
      # confirmado con qwen38flash (ver docs/kv-cache-persistence.md), un
      # hit de cache baja el prefill de miles de tokens a decenas.
      # GLM ya usa ~61-65GiB de RAM del host para los expertos MoE
      # ofloadeados a CPU (--fit); 32768 MiB (32GiB) deja margen real sobre
      # los 125GiB totales de octoserver sin arriesgar OOM del host.
      - --cache-ram
      - "32768"
      # Igual que en qwen38flash: espaciado mas fino que el default (8192)
      # para diffs chicos de un flujo agentico.
      - --checkpoint-min-step
      - "1024"
      # Techo de checkpoints por slot (viven en VRAM, ~112.5 MiB cada uno en
      # qwen38flash con --verbosity 4; se asume similar acá). El default
      # (32) en el peor caso teorico costaria varios GiB, demasiado con el
      # margen de VRAM ya ajustado por el auto-fit. En un dia de pruebas con
      # qwen38flash nunca se vieron mas de 4 checkpoints vivos a la vez (la
      # logica interna los invalida solos al cambiar de conversacion), pero
      # 8 acota el peor caso teorico sin costar nada en el uso real.
      - --ctx-checkpoints
      - "8"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 40
      start_period: 600s

networks:
  default:
    name: ${GLM_DOCKER_NETWORK:-glm53flash}
