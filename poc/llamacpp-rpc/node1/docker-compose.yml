services:
  llama-qwen3coder:
    image: ${LLAMACPP_SERVER_IMAGE:-evilfreelancer/llama.cpp-rpc:latest}
    container_name: aiworker-llama-qwen3coder
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      cd /usr/lib/x86_64-linux-gnu;
      for lib in libllama libggml libggml-base libggml-cpu libggml-rpc libmtmd; do
        [ -e "$$lib.so.0" ] || ln -s "$$lib.so" "$$lib.so.0";
      done;
      exec /app/llama-server --host 0.0.0.0 --port 8080
      -m ${QWEN3CODER_GGUF:-/models/qwen3coder-35b.gguf}
      -ngl ${QWEN3CODER_GPU_LAYERS:-99}
      --ctx-size ${QWEN3CODER_CTX_SIZE:-8192}
      --rpc ${QWEN3CODER_RPC_BACKENDS:-octoserver.core.sied.ar:5000}
    volumes:
      - ${MODELS_DIR:-/opt/llamacpp-rpc/models}:/models:ro
    ports:
      - "${QWEN3CODER_PORT:-8080}:8080"

